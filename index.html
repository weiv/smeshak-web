<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMESHAK aka TESSELAVA</title>
<meta name="description" content="Fractal mesh extraction.">
<meta property="og:title" content="SMESHAK">
<meta property="og:description" content="Fractal mesh extraction.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #080810;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
  }

  #c { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: clamp(20px, 4vh, 40px);
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }

  .wordmark {
    font-size: clamp(26px, 4.5vw, 56px);
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #ededff;
    text-shadow:
      0 0 40px rgba(110, 90, 255, 0.45),
      0 0 120px rgba(80, 60, 200, 0.2);
  }

  .sub {
    margin-top: 10px;
    font-size: clamp(10px, 1.1vw, 13px);
    letter-spacing: 0.28em;
    color: #38384e;
    text-transform: uppercase;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    padding-bottom: clamp(16px, 3vh, 28px);
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }

  .hint {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #2a2a3c;
    text-transform: uppercase;
    transition: color 0.4s;
  }
  body:hover .hint { color: #48485e; }

  /* Loading overlay */
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 20;
    background: #080810;
    transition: opacity 0.7s ease;
  }
  #loader.fade { opacity: 0; pointer-events: none; }

  .ring {
    width: 28px; height: 28px;
    border: 1.5px solid #16162a;
    border-top-color: #5a40d0;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .load-pct {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #30304a;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="ring"></div>
  <div class="load-pct" id="pct">Loading</div>
</div>

<canvas id="c"></canvas>

<header>
  <span class="wordmark">SMESHAK</span>
  <span class="wordmark">aka</span>
  <span class="wordmark">TESSELAVA</span>
  <span class="sub">Fractal mesh extraction</span>
</header>

<footer>
  <span class="hint">drag to rotate &nbsp;·&nbsp; scroll to zoom</span>
</footer>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.169/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE               from 'three';
import { OrbitControls }        from 'three/addons/controls/OrbitControls.js';
import { PLYLoader }            from 'three/addons/loaders/PLYLoader.js';

const canvas  = document.getElementById('c');
const loader  = document.getElementById('loader');
const pctEl   = document.getElementById('pct');

// ── Renderer ──────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// ── Scene ─────────────────────────────────────────────────────────────
const scene      = new THREE.Scene();
scene.background = new THREE.Color(0x080810);
scene.fog        = new THREE.FogExp2(0x080810, 0.28);

// ── Camera + Controls ─────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(42, 1, 0.001, 30);
camera.position.set(0, 0.2, 3);

const controls            = new OrbitControls(camera, canvas);
controls.enableDamping    = true;
controls.dampingFactor    = 0.06;
controls.autoRotate       = true;
controls.autoRotateSpeed  = 0.7;
controls.minDistance      = 0.8;
controls.maxDistance      = 7;
controls.target.set(0, 0, 0);

// ── Lights ────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x9090bb, 0.5));

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2.5, 3, 2);
scene.add(key);

const rim = new THREE.DirectionalLight(0x5533ff, 1.0);
rim.position.set(-3, -0.5, -2);
scene.add(rim);

const fill = new THREE.PointLight(0x3366ff, 0.6, 10);
fill.position.set(-1, -3, 1);
scene.add(fill);

// ── Material ──────────────────────────────────────────────────────────
const mat = new THREE.MeshPhysicalMaterial({
  color:              0xd4d4f0,
  metalness:          0.15,
  roughness:          0.4,
  clearcoat:          0.5,
  clearcoatRoughness: 0.25,
});

// ── Load PLY ──────────────────────────────────────────────────────────
new PLYLoader().load(
  'model.ply',
  (geo) => {
    if (!geo.attributes.normal) geo.computeVertexNormals();

    // Center on origin; fractal coords can be arbitrary so normalize them
    // to a stable size so the camera framing doesn't depend on the export params.
    geo.computeBoundingBox();
    const center = new THREE.Vector3();
    geo.boundingBox.getCenter(center);
    geo.translate(-center.x, -center.y, -center.z);

    geo.computeBoundingSphere();
    const scale = 1.5 / geo.boundingSphere.radius;

    const mesh = new THREE.Mesh(geo, mat);
    mesh.scale.setScalar(scale);
    scene.add(mesh);

    loader.classList.add('fade');
    setTimeout(() => { loader.style.display = 'none'; }, 750);
  },
  (xhr) => {
    if (xhr.total > 0) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      pctEl.textContent = pct < 100 ? `Loading ${pct}%` : 'Building…';
    }
  }
);

// ── Render loop ───────────────────────────────────────────────────────
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

renderer.setAnimationLoop(() => {
  resize();
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
